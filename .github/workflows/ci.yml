name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/crypto-service}}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: "rustfmt, clippy"}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S services/storage-service -B storage-build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build storage-build -j2
      - run: ctest --test-dir storage-build --output-on-failure
      - run: |
          STORAGE_DATA_DIR="$RUNNER_TEMP/chunks" ./storage-build/storage-service &
          for i in $(seq 1 30); do curl -fsS http://localhost:9000/health && break; sleep 1; done
          node tests/storage-smoke.mjs
          cargo test --manifest-path tests/fault-injection/Cargo.toml
  stack:
    runs-on: ubuntu-latest
    env: {JWT_SECRET: "ci-only-secret-abcdefghijklmnopqrstuvwxyz"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: docker compose up --build -d
      - run: npm ci
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env: {COMPOSE_RESTART: "1"}
      - name: Verify same-origin frontend proxy
        run: |
          curl --retry 30 --retry-connrefused --retry-delay 2 --fail http://localhost:5173/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/v1/files)" = "401"
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

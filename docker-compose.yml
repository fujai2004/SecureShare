services:
  crypto-service:
    build: ./services/crypto-service
    ports: ["127.0.0.1:8080:8080"]
    environment:
      RUST_LOG: info
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env using .env.example}
      DATABASE_PATH: /metadata/secureshare.db
      STORAGE_SERVICE_URL: http://storage-service:9000
      FRONTEND_ORIGIN: http://localhost:5173
    volumes: [metadata:/metadata]
    depends_on: [storage-service]
  storage-service:
    build: ./services/storage-service
    expose: ["9000"]
    volumes: [storage-data:/data]
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [crypto-service]
volumes:
  metadata:
  storage-data:

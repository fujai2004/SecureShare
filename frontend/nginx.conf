server {
    listen 5173;
    root /usr/share/nginx/html;
    location / { try_files $uri $uri/ /index.html; }
    location /v1/ {
        proxy_pass http://crypto-service:8080;
        client_max_body_size 26m;
        proxy_read_timeout 60s;
    }
    location = /health { return 200 "ok"; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
}

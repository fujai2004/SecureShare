apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: secureshare-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: frontend
          image: secureshare/frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5173}]
          readinessProbe: {httpGet: {path: /health, port: 5173}, initialDelaySeconds: 2}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: secureshare-system}
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 5173}]

apiVersion: apps/v1
kind: Deployment
metadata: {name: crypto-service, namespace: secureshare-system}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: crypto-service}}
  template:
    metadata: {labels: {app: crypto-service}}
    spec:
      containers:
        - name: crypto-service
          image: secureshare/crypto-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: STORAGE_SERVICE_URL, value: "http://storage-service:9000"}
            - {name: DATABASE_PATH, value: /metadata/secureshare.db}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: secureshare-secrets, key: jwt-secret}}
          volumeMounts: [{name: metadata, mountPath: /metadata}]
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 2}
      volumes: [{name: metadata, persistentVolumeClaim: {claimName: metadata}}]
---
apiVersion: v1
kind: Service
metadata: {name: crypto-service, namespace: secureshare-system}
spec:
  selector: {app: crypto-service}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: metadata, namespace: secureshare-system}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
